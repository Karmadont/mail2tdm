; ============================================================
;  ОБРАЗЕЦ файла настроек mail2tdm
; ============================================================
;
;  ЭТО ТОЛЬКО ОБРАЗЕЦ. Настоящий файл с токеном должен лежать НА РАБОЧЕМ ПК
;  по адресу:   %APPDATA%\mail2tdm\config.ini
;
;  Чтобы туда попасть: нажми Win+R, вставь  %APPDATA%  и нажми Enter,
;  создай папку mail2tdm, положи туда файл config.ini и заполни значения.
;
;  ВАЖНО: настоящий config.ini НИКОГДА не кладём в репозиторий -
;  в нём токен доступа бота. Репозиторий публичный.
;
;  Файл сохраняй в кодировке UTF-8.
; ============================================================


; --- Доступ к Bot API ---------------------------------------

; Адрес сервера Bot API. Возьми из технической документации TDM.
; Пример вида: https://ИМЯ-СЕРВЕРА
BaseUrl=

; Персональный токен бота. Его выдаёт бот Bot Creator по команде /token
; после того, как техподдержка предоставит доступ.
; НИКОМУ не пересылай этот токен, в том числе в переписке.
Token=

; ID рабочего пространства и ID группы (канала), куда шлём задачи.
; Как узнать: открой ВЕБ-ВЕРСИЮ TDM в браузере, зайди в нужный канал -
; оба числа будут прямо в адресной строке.
WorkspaceId=
GroupId=


; --- Какие письма пересылать --------------------------------

; Почтовый ящик, за которым следим. Пусто = основной ящик Outlook.
; Для общей почты укажи её название так, как оно видно в списке слева.
MailboxName=

; Папка внутри ящика. Пусто = "Входящие".
FolderPath=

; ПО УМОЛЧАНИЮ ПЕРЕСЫЛАЮТСЯ ВСЕ ПИСЬМА БЕЗ РАЗБОРА.
; Два поля ниже - необязательные фильтры на будущее. Пока они пустые,
; никакой отбор не производится: в канал уходит каждое входящее письмо.

; Если когда-нибудь понадобится: пересылать только письма,
; где в ТЕМЕ есть этот текст. Пусто = пересылать все.
SubjectContains=

; Если когда-нибудь понадобится: пересылать только письма
; от этого отправителя (часть адреса). Пусто = пересылать все.
SenderContains=


; --- Поведение ----------------------------------------------

; ТЕСТОВЫЙ РЕЖИМ. 1 = НИЧЕГО НЕ ОТПРАВЛЯТЬ, только записывать в журнал,
; что было бы отправлено. Начинай всегда с 1, пока не убедишься,
; что письма отбираются и оформляются правильно.
; 0 = отправлять по-настоящему.
TestMode=1

; Максимальная длина сообщения. Более длинный текст будет обрезан.
MaxLength=3000

; Куда писать журнал работы. Пусто = %APPDATA%\mail2tdm\mail2tdm.log
LogPath=
