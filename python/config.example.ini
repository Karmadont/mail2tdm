; ============================================================
;  ОБРАЗЕЦ настроек mail2tdm (версия на Python)
; ============================================================
;
;  ЧТО СДЕЛАТЬ: скопируй этот файл рядом под именем config.ini
;  и заполни значения. Сохраняй в кодировке UTF-8.
;
;  ВАЖНО: config.ini с настоящим токеном НИКОГДА не выкладывается
;  в репозиторий и никому не пересылается - даже разработчику.
; ============================================================


; --- Доступ к Bot API ---------------------------------------

; Адрес сервера Bot API (из технической документации TDM).
BaseUrl=

; Токен бота. Его выдаёт бот Bot Creator по команде /token.
; Никому не пересылай. Если утёк - выпусти новый той же командой.
Token=

; ID рабочего пространства и ID группы (канала), куда шлём письма.
; Как узнать: открой ВЕБ-ВЕРСИЮ TDM в браузере, зайди в нужный канал -
; оба числа будут прямо в адресной строке.
WorkspaceId=
GroupId=


; --- Какие письма пересылать --------------------------------
;
;  ПЕРЕСЫЛАЮТСЯ ВСЕ ПИСЬМА БЕЗ РАЗБОРА - никаких фильтров нет.

; Почтовый ящик. Пусто = основной ящик Outlook.
; Для общей почты укажи её название так, как оно видно в списке слева.
MailboxName=

; Папка внутри ящика. Пусто = "Входящие".
; Вложенную папку писать через обратный слэш: Входящие\Задачи
FolderPath=


; --- Поведение ----------------------------------------------

; ТЕСТОВЫЙ РЕЖИМ.
;   1 = НИЧЕГО НЕ ОТПРАВЛЯТЬ, только писать в журнал, что было бы отправлено.
;   0 = отправлять по-настоящему.
; Начинай ВСЕГДА с 1. Посмотри журнал день, оцени поток - и только потом 0.
TestMode=1

; Пересылать ли сами файлы, приложенные к письмам.
;   0 = только упомянуть их названия в тексте (безопасно, начни с этого)
;   1 = загружать файлы в TDM и отправлять их сообщениями
SendAttachments=0

; Сколько последних писем просматривать за один проход.
BatchLimit=20

; Как часто проверять почту в режиме --watch, в секундах.
IntervalSeconds=60

; Максимальная длина текста сообщения. Длиннее - обрежется.
MaxLength=3000

; Куда писать журнал. Пусто = файл mail2tdm.log рядом с настройками.
LogPath=

; Временная папка для вложений. Пусто = системная временная папка.
TempDir=
